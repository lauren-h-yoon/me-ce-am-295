name: Build & deploy course site

# Builds the Quarto site from the committed course-original content/ and
# publishes to GitHub Pages. (Raw materials + third-party papers are NOT in the
# repo; content/ holds the normalized, course-original Markdown.)
on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "pipeline/build_site.py"
      - "pipeline/config.py"
      - "site/assets/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Quarto pages from content/
        run: python -m pipeline.build_site --all

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
