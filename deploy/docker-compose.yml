# Always-on Weekly AI TA on a remote host.
#   cd deploy && docker compose up -d --build
#   docker compose logs -f
#
# Requires ../.env with SLACK_BOT_TOKEN, SLACK_APP_TOKEN, and ONE of
# ANTHROPIC_API_KEY (recommended for a class) or CLAUDE_CODE_OAUTH_TOKEN.
services:
  weekly-bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      # Provide the FULL content corpus (incl. references) from the host, read-only.
      # Populate it first with `pipeline.gdrive_sync && pipeline.sync` or rsync.
      - ../content:/app/content:ro
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      # the bot logs "Bolt app is running!" once the socket connects
      test: ["CMD-SHELL", "pgrep -f 'bot.app' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
